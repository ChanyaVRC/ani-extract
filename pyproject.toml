[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ani-extract"
version = "0.1.0"
description = "Command-line tool to extract frame images from Windows animated cursors (.ani)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Chanya" }]
keywords = ["ani", "cursor", "windows", "icon", "riff", "png", "gif", "apng"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = ["Pillow>=10.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ani-extract = "ani_extract.cli:main"

[project.urls]
Homepage = "https://github.com/ChanyaVRC/ani-extract"
Issues = "https://github.com/ChanyaVRC/ani-extract/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ani_extract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ani_extract"]
